<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ffbd16" />
    <title>Фотоотчёт точки · Bulka</title>
    <link rel="stylesheet" href="/branch-reports/report.css" />
    <script src="/branch-reports/report.js?v=bulka-premium-1" defer></script>
    <link rel="stylesheet" href="/assets/brand/bulka-controls.css?v=bulka-premium-1" />
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="/admin/bulka_logo.png" alt="Bulka" width="118" height="44" /><span
          id="report-mode"
          >Фотоотчёты точки</span
        >
      </header>
      <section id="loading" class="panel" aria-busy="true">
        <p role="status">Загрузка…</p>
        <div class="loading-shape" aria-hidden="true"></div>
        <div class="loading-shape" aria-hidden="true"></div>
      </section>
      <section id="device" class="panel device-panel" aria-labelledby="device-branch" hidden>
        <p id="device-city" class="eyebrow"></p>
        <h1 id="device-branch">Планшет точки</h1>
        <div class="device-heading">
          <span class="device-icon" aria-hidden="true">
            <svg
              class="bulka-icon"
              viewBox="0 0 24 24"
              width="30"
              height="30"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#Tablet" />
            </svg>
          </span>
          <h2 id="device-status" role="status">Проверяем подключение…</h2>
        </div>
        <p id="device-message" class="hint"></p>
        <div id="pairing" class="pairing" hidden>
          <p id="pairing-label" class="eyebrow">Код подключения</p>
          <p id="pairing-code" aria-labelledby="pairing-label"></p>
          <p id="pairing-expiry" class="hint"></p>
        </div>
        <div class="device-actions">
          <button id="enroll-device" class="primary" type="button">Подключить планшет</button>
          <button id="check-device" class="secondary" type="button">Проверить подключение</button>
        </div>
      </section>
      <section id="intro" class="panel" hidden>
        <p id="city" class="eyebrow"></p>
        <h1 id="branch"></h1>
        <div id="shifts" class="shift-picker" role="group" aria-label="Смена" hidden>
          <button type="button" class="secondary" data-shift="day">
            <strong>1 смена</strong><small></small>
          </button>
          <button type="button" class="secondary" data-shift="night">
            <strong>2 смена</strong><small></small>
          </button>
        </div>
        <p class="date">Отчёт за <strong id="date"></strong></p>
        <div id="categories">
          <button class="report-kind" type="button" data-kind="hall">
            <span class="kind-icon" aria-hidden="true"
              ><svg
                class="bulka-icon"
                viewBox="0 0 24 24"
                width="30"
                height="30"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#Store" /></svg></span
            ><span
              ><strong>Фотоотчёт зала</strong><small id="hall-status">Ещё не отправлен</small></span
            ><svg
              class="bulka-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#ChevronRight" />
            </svg>
          </button>
          <button class="report-kind" type="button" data-kind="baker">
            <span class="kind-icon" aria-hidden="true"
              ><svg
                class="bulka-icon"
                viewBox="0 0 24 24"
                width="30"
                height="30"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#ChefHat" /></svg></span
            ><span
              ><strong>Фотоотчёт пекаря</strong
              ><small id="baker-status">Ещё не отправлен</small></span
            ><svg
              class="bulka-icon"
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.75"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
              focusable="false"
            >
              <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#ChevronRight" />
            </svg>
          </button>
        </div>
      </section>
      <section id="capture" class="panel" hidden>
        <button id="back" class="secondary" type="button">
          <svg
            class="bulka-icon"
            viewBox="0 0 24 24"
            width="20"
            height="20"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#ArrowLeft" />
          </svg>
          К выбору отчёта
        </button>
        <h1 id="capture-title"></h1>
        <p id="capture-date" class="date"></p>
        <div id="camera-area">
          <video id="camera" autoplay muted playsinline aria-label="Изображение с камеры"></video>
          <p id="camera-hint" class="hint">Разрешите доступ к камере.</p>
          <button id="enable-camera" type="button" class="primary">Открыть камеру</button>
          <button id="take-photo" type="button" class="primary" hidden>Сделать снимок</button>
        </div>
        <div class="counter-row">
          <h2>Снимки <span id="count">0 / 10</span></h2>
        </div>
        <div id="previews" aria-label="Снимки отчёта"></div>
        <div class="send-bar">
          <button id="send" type="button" class="primary" disabled>Отправить отчёт</button>
          <p id="send-status" role="status" class="sr-only"></p>
        </div>
      </section>
      <section id="success" class="panel success" hidden>
        <div aria-hidden="true">
          <svg
            class="bulka-icon"
            viewBox="0 0 24 24"
            width="52"
            height="52"
            fill="none"
            stroke="currentColor"
            stroke-width="1.75"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
            focusable="false"
          >
            <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#CheckCircle2" />
          </svg>
        </div>
        <h1>Фотоотчёт отправлен</h1>
        <p id="success-detail"></p>
        <button id="next-report" type="button" class="primary">К отчётам точки</button>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="retry" class="secondary" type="button" hidden>Обновить данные</button>
    </main>
  </body>
</html>
