<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#ffbd16" />
    <title>Фотоотчёт точки · Bulka</title>
    <link rel="stylesheet" href="/branch-reports/report.css" />
    <script src="/branch-reports/report.js" defer></script>
  </head>
  <body>
    <main>
      <header class="brand">
        <img src="/admin/bulka_logo.png" alt="Bulka" width="118" height="44" /><span
          >Закрытие точки</span
        >
      </header>
      <section id="loading" class="panel" aria-busy="true">
        <p role="status">Загрузка…</p>
        <div class="loading-shape" aria-hidden="true"></div>
        <div class="loading-shape" aria-hidden="true"></div>
      </section>
      <section id="intro" class="panel" hidden>
        <p id="city" class="eyebrow"></p>
        <h1 id="branch"></h1>
        <p class="date">Отчёт за <strong id="date"></strong></p>
        <div id="categories">
          <button class="report-kind" type="button" data-kind="hall">
            <span class="kind-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <rect x="3" y="3" width="18" height="18" rx="3" />
                <path d="M9 3v18M15 3v18M3 9h18M3 15h18" /></svg></span
            ><span
              ><strong>Фотоотчёт зала</strong><small id="hall-status">Ещё не отправлен</small></span
            ><span aria-hidden="true">›</span>
          </button>
          <button class="report-kind" type="button" data-kind="baker">
            <span class="kind-icon" aria-hidden="true"
              ><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
                <path
                  d="M7 14H5a4 4 0 0 1 0-8 4 4 0 0 1 7-2 4 4 0 0 1 7 2 4 4 0 0 1 0 8h-2M7 11v10h10V11M7 17h10"
                /></svg></span
            ><span
              ><strong>Фотоотчёт пекаря</strong
              ><small id="baker-status">Ещё не отправлен</small></span
            ><span aria-hidden="true">›</span>
          </button>
        </div>
      </section>
      <section id="capture" class="panel" hidden>
        <button id="back" class="secondary" type="button">← К выбору отчёта</button>
        <h1 id="capture-title"></h1>
        <p id="capture-date" class="date"></p>
        <div id="camera-area">
          <video id="camera" autoplay muted playsinline aria-label="Изображение с камеры"></video>
          <p id="camera-hint" class="hint">Разрешите доступ к камере.</p>
          <button id="enable-camera" type="button" class="primary">Открыть камеру</button>
          <button id="take-photo" type="button" class="primary" hidden>Сделать снимок</button>
        </div>
        <div class="counter-row">
          <h2>Снимки <span id="count">0 / 10</span></h2>
        </div>
        <div id="previews" aria-label="Снимки отчёта"></div>
        <div class="send-bar">
          <button id="send" type="button" class="primary" disabled>Отправить отчёт</button>
          <p id="send-status" role="status" class="sr-only"></p>
        </div>
      </section>
      <section id="success" class="panel success" hidden>
        <div aria-hidden="true">✓</div>
        <h1>Фотоотчёт отправлен</h1>
        <p id="success-detail"></p>
        <button id="next-report" type="button" class="primary">К отчётам точки</button>
      </section>
      <p id="error" class="error" role="alert" hidden></p>
      <button id="retry" class="secondary" type="button" hidden>Обновить данные</button>
    </main>
  </body>
</html>
