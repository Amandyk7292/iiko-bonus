<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="660x660" href="/assets/wallet/bulka-wallet-logo.png?v=20260715" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fcfbf9" />
    <title>Регистрация в бонусной системе</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #fcfbf9;
        --surface: #ffffff;
        --surface-muted: #fdfbf7;
        --primary: #b88c5a;
        --primary-strong: #9a714a;
        --heading: #7e5d40;
        --text: #333333;
        --text-muted: #666666;
        --border: #e3d2b7;
        --border-soft: #efe6d5;
        --success: #2f855a;
        --success-bg: #f0fff4;
        --success-border: #c6f6d5;
        --danger: #c53030;
        --danger-bg: #fff5f5;
        --danger-border: #fed7d7;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: 24px;
        display: grid;
        place-items: center;
        background: var(--page);
        color: var(--text);
        font-family: "Inter", sans-serif;
        line-height: 1.5;
      }

      .card {
        width: min(100%, 430px);
        padding: clamp(24px, 6vw, 44px) clamp(20px, 6vw, 40px);
        overflow: hidden;
        border: 1px solid var(--border-soft);
        border-radius: 20px;
        background: var(--surface);
        box-shadow: 0 18px 50px rgba(184, 140, 90, 0.09);
        animation: card-enter 260ms ease-out both;
      }

      .language-switcher {
        display: flex;
        width: fit-content;
        margin: 0 0 28px auto;
        padding: 3px;
        gap: 3px;
        border: 1px solid var(--border-soft);
        border-radius: 12px;
        background: var(--surface-muted);
      }

      .language-button {
        min-width: 44px;
        min-height: 44px;
        padding: 0 10px;
        border: 0;
        border-radius: 9px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font: inherit;
        font-size: 0.82rem;
        font-weight: 600;
        transition:
          background-color 180ms ease,
          color 180ms ease,
          box-shadow 180ms ease;
      }

      .language-button[aria-pressed="true"] {
        background: var(--surface);
        color: var(--heading);
        box-shadow: 0 2px 8px rgba(184, 140, 90, 0.12);
      }

      h1 {
        margin: 0 0 8px;
        color: var(--heading);
        font-family: "Playfair Display", serif;
        font-size: clamp(1.8rem, 7vw, 2.2rem);
        line-height: 1.15;
        text-align: center;
      }

      .lead {
        max-width: 34ch;
        margin: 0 auto 28px;
        color: var(--text-muted);
        font-size: 0.94rem;
        text-align: center;
      }

      .notice {
        display: none;
        margin-bottom: 20px;
        padding: 12px 14px;
        border: 1px solid;
        border-radius: 10px;
        font-size: 0.9rem;
      }

      .notice.is-visible {
        display: block;
        animation: notice-enter 180ms ease-out both;
      }

      .notice.success {
        border-color: var(--success-border);
        background: var(--success-bg);
        color: var(--success);
      }

      .notice.error {
        border-color: var(--danger-border);
        background: var(--danger-bg);
        color: var(--danger);
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        margin-bottom: 7px;
        color: var(--primary-strong);
        font-size: 0.78rem;
        font-weight: 600;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      input {
        width: 100%;
        min-height: 48px;
        padding: 12px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        outline: 0;
        background: var(--surface-muted);
        color: var(--text);
        font: inherit;
        font-size: 1rem;
        transition:
          border-color 180ms ease,
          box-shadow 180ms ease,
          background-color 180ms ease;
      }

      input:focus-visible,
      button:focus-visible,
      a:focus-visible {
        outline: 3px solid rgba(184, 140, 90, 0.24);
        outline-offset: 2px;
      }

      input:focus {
        border-color: var(--primary);
        background: var(--surface);
        box-shadow: 0 0 0 3px rgba(184, 140, 90, 0.1);
      }

      input[aria-invalid="true"] {
        border-color: var(--danger);
      }

      .field-error {
        min-height: 19px;
        margin: 5px 0 0;
        color: var(--danger);
        font-size: 0.78rem;
      }

      #otpBlock[hidden] {
        display: none;
      }

      .whatsapp-link {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        margin: -4px 0 18px;
        color: var(--primary-strong);
        font-size: 0.88rem;
        font-weight: 600;
        text-underline-offset: 3px;
      }

      .whatsapp-link[hidden] {
        display: none;
      }

      .submit-button {
        width: 100%;
        min-height: 50px;
        padding: 13px 18px;
        border: 0;
        border-radius: 10px;
        background: var(--primary);
        color: #ffffff;
        cursor: pointer;
        font: inherit;
        font-size: 1rem;
        font-weight: 600;
        transition:
          background-color 180ms ease,
          transform 180ms ease,
          box-shadow 180ms ease;
      }

      .submit-button:hover:not(:disabled) {
        background: var(--primary-strong);
        box-shadow: 0 8px 18px rgba(184, 140, 90, 0.2);
        transform: translateY(-1px);
      }

      .submit-button:active:not(:disabled) {
        transform: translateY(0);
      }

      .submit-button:disabled {
        cursor: wait;
        opacity: 0.62;
      }

      @keyframes card-enter {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes notice-enter {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 12px;
        }

        .card {
          border-radius: 16px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="card" aria-labelledby="pageTitle">
      <div class="language-switcher" role="group" aria-label="Language / Тіл / Язык">
        <button class="language-button" type="button" data-lang="ru" aria-pressed="true">RU</button>
        <button class="language-button" type="button" data-lang="kk" aria-pressed="false">KZ</button>
        <button class="language-button" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>

      <h1 id="pageTitle" data-i18n="heading">Карта лояльности</h1>
      <p class="lead" data-i18n="subtitle">
        Зарегистрируйтесь, чтобы получать кэшбэк и оплачивать покупки баллами.
      </p>

      <div id="successMessage" class="notice success" role="status" aria-live="polite"></div>
      <div id="errorMessage" class="notice error" role="alert" tabindex="-1"></div>

      <form id="regForm" novalidate>
        <div class="field">
          <label for="name" data-i18n="nameLabel">Ваше имя</label>
          <input
            type="text"
            id="name"
            name="name"
            maxlength="160"
            autocomplete="name"
            data-i18n-placeholder="namePlaceholder"
            placeholder="Иван"
            aria-describedby="nameError"
            required
          />
          <p class="field-error" id="nameError" aria-live="polite"></p>
        </div>

        <div class="field">
          <label for="phone" data-i18n="phoneLabel">Номер телефона</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            inputmode="tel"
            autocomplete="tel"
            placeholder="+7 (___) ___-__-__"
            aria-describedby="phoneError"
            required
          />
          <p class="field-error" id="phoneError" aria-live="polite"></p>
        </div>

        <div id="otpBlock" hidden>
          <div class="field">
            <label for="otp" data-i18n="otpLabel">Код подтверждения</label>
            <input
              type="text"
              id="otp"
              name="otp"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{4}"
              maxlength="4"
              placeholder="0000"
              aria-describedby="otpError"
            />
            <p class="field-error" id="otpError" aria-live="polite"></p>
          </div>
          <a
            id="waLink"
            class="whatsapp-link"
            target="_blank"
            rel="noopener noreferrer"
            data-i18n="openWhatsApp"
            hidden
          >Открыть WhatsApp для получения кода</a>
        </div>

        <button class="submit-button" type="submit" id="submitBtn" data-i18n="getCode">
          Получить код в WhatsApp
        </button>
      </form>
    </main>

    <script>
      const translations = {
        ru: {
          documentTitle: "Регистрация в бонусной системе",
          heading: "Карта лояльности",
          subtitle: "Зарегистрируйтесь, чтобы получать кэшбэк и оплачивать покупки баллами.",
          nameLabel: "Ваше имя",
          namePlaceholder: "Иван",
          phoneLabel: "Номер телефона",
          otpLabel: "Код подтверждения",
          openWhatsApp: "Открыть WhatsApp для получения кода",
          getCode: "Получить код в WhatsApp",
          confirm: "Подтвердить и зарегистрироваться",
          checking: "Проверка…",
          nameRequired: "Введите имя.",
          phoneInvalid: "Введите полный номер телефона.",
          otpInvalid: "Введите 4 цифры из сообщения.",
          requestFailed: "Не удалось запросить код. Попробуйте ещё раз.",
          invalidCode: "Код неверный или устарел. Запросите новый код.",
          registrationFailed: "Не удалось завершить регистрацию. Попробуйте ещё раз.",
          alreadyRegistered: "Этот номер уже зарегистрирован в программе лояльности.",
          success: "Вы успешно зарегистрированы! Назовите свой номер на кассе.",
          codeSent: "Запрос создан. Получите код в WhatsApp и введите его ниже.",
          networkError: "Нет связи с сервером. Проверьте интернет и повторите попытку."
        },
        kk: {
          documentTitle: "Бонустық жүйеге тіркелу",
          heading: "Адалдық картасы",
          subtitle: "Кэшбэк алып, сатып алуды ұпайлармен төлеу үшін тіркеліңіз.",
          nameLabel: "Атыңыз",
          namePlaceholder: "Айдос",
          phoneLabel: "Телефон нөмірі",
          otpLabel: "Растау коды",
          openWhatsApp: "Код алу үшін WhatsApp-ты ашу",
          getCode: "WhatsApp арқылы код алу",
          confirm: "Растау және тіркелу",
          checking: "Тексерілуде…",
          nameRequired: "Атыңызды енгізіңіз.",
          phoneInvalid: "Телефон нөмірін толық енгізіңіз.",
          otpInvalid: "Хабарламадағы 4 санды енгізіңіз.",
          requestFailed: "Кодты сұрату мүмкін болмады. Қайталап көріңіз.",
          invalidCode: "Код қате немесе ескірген. Жаңа код сұратыңыз.",
          registrationFailed: "Тіркелуді аяқтау мүмкін болмады. Қайталап көріңіз.",
          alreadyRegistered: "Бұл нөмір адалдық бағдарламасында бұрыннан тіркелген.",
          success: "Сіз сәтті тіркелдіңіз! Кассада телефон нөміріңізді айтыңыз.",
          codeSent: "Сұрау жасалды. WhatsApp-та кодты алып, төменге енгізіңіз.",
          networkError: "Сервермен байланыс жоқ. Интернетті тексеріп, қайталап көріңіз."
        },
        en: {
          documentTitle: "Join the loyalty program",
          heading: "Loyalty card",
          subtitle: "Register to earn cashback and pay for purchases with points.",
          nameLabel: "Your name",
          namePlaceholder: "Alex",
          phoneLabel: "Phone number",
          otpLabel: "Verification code",
          openWhatsApp: "Open WhatsApp to receive the code",
          getCode: "Get a code in WhatsApp",
          confirm: "Verify and register",
          checking: "Checking…",
          nameRequired: "Enter your name.",
          phoneInvalid: "Enter your full phone number.",
          otpInvalid: "Enter the 4 digits from the message.",
          requestFailed: "Could not request a code. Please try again.",
          invalidCode: "The code is invalid or expired. Request a new code.",
          registrationFailed: "Could not complete registration. Please try again.",
          alreadyRegistered: "This number is already registered in the loyalty program.",
          success: "Registration complete! Tell the cashier your phone number.",
          codeSent: "Request created. Get the code in WhatsApp and enter it below.",
          networkError: "The server is unavailable. Check your connection and try again."
        }
      };

      const languageButtons = [...document.querySelectorAll("[data-lang]")];
      const phoneInput = document.getElementById("phone");
      const nameInput = document.getElementById("name");
      const otpInput = document.getElementById("otp");
      const otpBlock = document.getElementById("otpBlock");
      const waLink = document.getElementById("waLink");
      const submitButton = document.getElementById("submitBtn");
      const successMessage = document.getElementById("successMessage");
      const errorMessage = document.getElementById("errorMessage");

      let language = localStorage.getItem("bulka-language");
      if (!translations[language]) {
        const browserLanguage = (navigator.language || "ru").toLowerCase();
        language = browserLanguage.startsWith("kk") ? "kk" : browserLanguage.startsWith("en") ? "en" : "ru";
      }
      let otpRequested = false;
      let registrationToken = "";
      let requestedPhone = "";

      function t(key) {
        return translations[language][key] || translations.ru[key] || key;
      }

      function setLanguage(nextLanguage) {
        if (!translations[nextLanguage]) return;
        language = nextLanguage;
        localStorage.setItem("bulka-language", language);
        document.documentElement.lang = language;
        document.title = t("documentTitle");
        document.querySelectorAll("[data-i18n]").forEach((element) => {
          element.textContent = t(element.dataset.i18n);
        });
        document.querySelectorAll("[data-i18n-placeholder]").forEach((element) => {
          element.placeholder = t(element.dataset.i18nPlaceholder);
        });
        languageButtons.forEach((button) => {
          button.setAttribute("aria-pressed", String(button.dataset.lang === language));
        });
        updateSubmitLabel();
        clearFieldErrors();
      }

      function clearNotices() {
        successMessage.classList.remove("is-visible");
        errorMessage.classList.remove("is-visible");
        successMessage.textContent = "";
        errorMessage.textContent = "";
      }

      function showNotice(type, message) {
        clearNotices();
        const target = type === "success" ? successMessage : errorMessage;
        target.textContent = message;
        target.classList.add("is-visible");
        if (type === "error") target.focus();
      }

      function clearFieldErrors() {
        [nameInput, phoneInput, otpInput].forEach((input) => input.setAttribute("aria-invalid", "false"));
        document.getElementById("nameError").textContent = "";
        document.getElementById("phoneError").textContent = "";
        document.getElementById("otpError").textContent = "";
      }

      function showFieldError(input, key, message) {
        input.setAttribute("aria-invalid", "true");
        document.getElementById(key).textContent = message;
      }

      function normalizedPhone() {
        return phoneInput.value.replace(/[^0-9]/g, "");
      }

      function resetOtpStep() {
        otpRequested = false;
        registrationToken = "";
        requestedPhone = "";
        otpInput.value = "";
        otpInput.required = false;
        otpBlock.hidden = true;
        waLink.hidden = true;
        waLink.removeAttribute("href");
        updateSubmitLabel();
      }

      function updateSubmitLabel(loading = false) {
        submitButton.textContent = loading ? t("checking") : otpRequested ? t("confirm") : t("getCode");
      }

      function setLoading(loading) {
        submitButton.disabled = loading;
        submitButton.setAttribute("aria-busy", String(loading));
        updateSubmitLabel(loading);
      }

      function makeRequestToken() {
        const bytes = new Uint8Array(12);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (value) => (value % 36).toString(36)).join("");
      }

      function localizeServerError(payload, fallbackKey) {
        const code = String(payload?.error || "").toLowerCase();
        if (["expired", "invalid", "attempts_exceeded"].includes(code)) return t("invalidCode");
        if (code.includes("network") || code.includes("fetch")) return t("networkError");
        return t(fallbackKey);
      }

      async function readJson(response) {
        try {
          return await response.json();
        } catch {
          return {};
        }
      }

      phoneInput.addEventListener("input", (event) => {
        let value = event.target.value.replace(/[^0-9]/g, "");
        if (!value) {
          event.target.value = "";
          if (otpRequested) resetOtpStep();
          return;
        }
        if (value.length === 10) value = "7" + value;
        if (value[0] === "8") value = "7" + value.substring(1);
        if (value[0] !== "7") value = "7" + value;
        value = value.substring(0, 11);

        let formatted = "+7";
        if (value.length > 1) formatted += " (" + value.substring(1, 4);
        if (value.length >= 5) formatted += ") " + value.substring(4, 7);
        if (value.length >= 8) formatted += "-" + value.substring(7, 9);
        if (value.length >= 10) formatted += "-" + value.substring(9, 11);
        event.target.value = formatted;

        if (otpRequested && requestedPhone && value !== requestedPhone) resetOtpStep();
        event.target.setAttribute("aria-invalid", "false");
        document.getElementById("phoneError").textContent = "";
      });

      nameInput.addEventListener("input", () => {
        nameInput.setAttribute("aria-invalid", "false");
        document.getElementById("nameError").textContent = "";
      });

      otpInput.addEventListener("input", () => {
        otpInput.value = otpInput.value.replace(/[^0-9]/g, "").slice(0, 4);
        otpInput.setAttribute("aria-invalid", "false");
        document.getElementById("otpError").textContent = "";
      });

      languageButtons.forEach((button) => {
        button.addEventListener("click", () => setLanguage(button.dataset.lang));
      });

      document.getElementById("regForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        clearNotices();
        clearFieldErrors();

        const phone = normalizedPhone();
        const name = nameInput.value.trim();
        let firstInvalid = null;
        if (!name) {
          showFieldError(nameInput, "nameError", t("nameRequired"));
          firstInvalid = nameInput;
        }
        if (phone.length !== 11) {
          showFieldError(phoneInput, "phoneError", t("phoneInvalid"));
          firstInvalid ||= phoneInput;
        }
        if (otpRequested && !/^[0-9]{4}$/.test(otpInput.value)) {
          showFieldError(otpInput, "otpError", t("otpInvalid"));
          firstInvalid ||= otpInput;
        }
        if (firstInvalid) {
          firstInvalid.focus();
          return;
        }

        setLoading(true);
        try {
          if (!otpRequested) {
            const requestToken = makeRequestToken();
            const response = await fetch("/api/auth/request-otp", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone, token: requestToken })
            });
            const payload = await readJson(response);
            if (!response.ok) throw new Error(localizeServerError(payload, "requestFailed"));

            otpRequested = true;
            requestedPhone = phone;
            otpInput.required = true;
            otpBlock.hidden = false;
            if (payload.whatsappUrl) {
              waLink.href = payload.whatsappUrl;
              waLink.hidden = false;
            }
            showNotice("success", t("codeSent"));
            otpInput.focus();
            return;
          }

          if (!registrationToken) {
            const response = await fetch("/api/auth/verify-otp", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ phone, code: otpInput.value })
            });
            const payload = await readJson(response);
            if (!response.ok || payload.success !== true) {
              throw new Error(localizeServerError(payload, "invalidCode"));
            }
            if (payload.exists) {
              showNotice("success", t("alreadyRegistered"));
              return;
            }
            registrationToken = payload.registrationToken || "";
            if (!registrationToken) throw new Error(t("registrationFailed"));
          }

          const response = await fetch("/api/register-iiko", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: "Bearer " + registrationToken
            },
            body: JSON.stringify({ name, phone })
          });
          const payload = await readJson(response);
          if (!response.ok) throw new Error(localizeServerError(payload, "registrationFailed"));

          document.getElementById("regForm").reset();
          resetOtpStep();
          showNotice("success", t("success"));
        } catch (error) {
          const message = error instanceof TypeError ? t("networkError") : error.message || t("registrationFailed");
          showNotice("error", message);
        } finally {
          setLoading(false);
        }
      });

      setLanguage(language);
    </script>
  </body>
</html>
