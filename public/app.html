
    <!DOCTYPE html>
    <html lang="ru">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Регистрация в Бонусной Системе</title>
      <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
      <style>
        body { 
          font-family: 'Inter', sans-serif; 
          background-color: #fcfbf9; 
          display: flex; 
          justify-content: center; 
          align-items: center; 
          height: 100vh; 
          margin: 0; 
          color: #333333;
        }
        .card { 
          background: #ffffff; 
          padding: 3rem 2.5rem; 
          border-radius: 12px; 
          border: 1px solid #efe6d5;
          box-shadow: 0 10px 30px rgba(184, 140, 90, 0.05); 
          max-width: 400px; 
          width: 100%; 
          text-align: center;
        }
        h1 { 
          font-family: 'Playfair Display', serif;
          margin-top: 0; 
          font-size: 2rem; 
          color: #7e5d40; 
          margin-bottom: 0.5rem;
        }
        p {
          color: #666;
          font-size: 0.9rem;
          margin-bottom: 2rem;
          line-height: 1.5;
        }
        label { 
          display: block; 
          text-align: left;
          margin-bottom: 0.4rem; 
          color: #9a714a; 
          font-weight: 500; 
          font-size: 0.85rem;
          text-transform: uppercase;
          letter-spacing: 0.05em;
        }
        input { 
          width: 100%; 
          padding: 0.85rem 1rem; 
          margin-bottom: 1.5rem; 
          border: 1px solid #e3d2b7; 
          background: #fdfbf7;
          border-radius: 8px; 
          box-sizing: border-box; 
          font-size: 1rem;
          color: #4a4a4a;
          transition: all 0.2s;
        }
        input:focus {
          outline: none;
          border-color: #b88c5a;
          box-shadow: 0 0 0 3px rgba(184, 140, 90, 0.1);
        }
        button { 
          width: 100%; 
          padding: 1rem; 
          background-color: #b88c5a; 
          color: white; 
          border: none; 
          border-radius: 8px; 
          font-size: 1rem; 
          font-weight: 500; 
          cursor: pointer; 
          transition: all 0.2s;
        }
        button:hover { 
          background-color: #9a714a; 
          transform: translateY(-1px);
        }
        .success { color: #2f855a; background: #f0fff4; padding: 1rem; border-radius: 8px; display: none; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid #c6f6d5; }
        .error { color: #c53030; background: #fff5f5; padding: 1rem; border-radius: 8px; display: none; margin-bottom: 1.5rem; font-size: 0.9rem; border: 1px solid #fed7d7; }
      </style>
    </head>
    <body>
      <div class="card">
        <h1>Карта Лояльности</h1>
        <p>Зарегистрируйтесь, чтобы получать кэшбэк и оплачивать покупки баллами.</p>
        
        <div id="successMessage" class="success">Вы успешно зарегистрированы! Называйте свой номер на кассе.</div>
        <div id="errorMessage" class="error">Произошла ошибка при регистрации.</div>

        <form id="regForm">
          <label>Ваше Имя</label>
          <input type="text" id="name" placeholder="Иван" required>
          
          <label>Номер телефона</label>
          <input type="tel" id="phone" placeholder="+7 (___) ___-__-__" required>

          <div id="otpBlock" style="display:none">
            <label>Код подтверждения</label>
            <input type="text" inputmode="numeric" maxlength="4" id="otp" placeholder="0000">
            <a id="waLink" target="_blank" rel="noopener noreferrer">Открыть WhatsApp для получения кода</a>
          </div>
          
          <button type="submit" id="submitBtn">Получить код в WhatsApp</button>
        </form>
      </div>

      <script>
        const phoneInput = document.getElementById('phone');
        
        phoneInput.addEventListener('input', function (e) {
            // Внутри шаблонной строки (backticks) слеши теряются, поэтому используем [^0-9]
            let val = e.target.value.replace(/[^0-9]/g, '');
            
            if (!val) {
                e.target.value = '';
                return;
            }
            
            if (val[0] === '8') val = '7' + val.substring(1);
            if (val[0] !== '7') val = '7' + val;
            
            val = val.substring(0, 11);
            
            let formatted = '+7';
            if (val.length > 1) formatted += ' (' + val.substring(1, 4);
            if (val.length >= 5) formatted += ') ' + val.substring(4, 7);
            if (val.length >= 8) formatted += '-' + val.substring(7, 9);
            if (val.length >= 10) formatted += '-' + val.substring(9, 11);
            
            e.target.value = formatted;
        });

        let otpRequested = false;
        let registrationToken = '';

        function makeRequestToken() {
          const bytes = new Uint8Array(12);
          crypto.getRandomValues(bytes);
          return Array.from(bytes, value => (value % 36).toString(36)).join('');
        }

        document.getElementById('regForm').addEventListener('submit', async (e) => {
          e.preventDefault();
          
          // Проверяем, что номер введен полностью (должно быть 11 цифр)
          const rawPhone = phoneInput.value.replace(/[^0-9]/g, '');
          if (rawPhone.length !== 11) {
            alert('Пожалуйста, введите корректный номер телефона полностью.');
            return;
          }

          const btn = document.getElementById('submitBtn');
          const successDiv = document.getElementById('successMessage');
          const errorDiv = document.getElementById('errorMessage');
          
          btn.disabled = true;
          btn.innerText = 'Проверка...';
          successDiv.style.display = 'none';
          errorDiv.style.display = 'none';
          
          try {
            if (!otpRequested) {
              const requestToken = makeRequestToken();
              const otpRes = await fetch('/api/auth/request-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: rawPhone, token: requestToken })
              });
              const otpData = await otpRes.json();
              if (!otpRes.ok) throw new Error(otpData.error || 'Не удалось запросить код');
              otpRequested = true;
              document.getElementById('otpBlock').style.display = 'block';
              document.getElementById('otp').required = true;
              document.getElementById('waLink').href = 'https://wa.me/77008317499?text=' + encodeURIComponent('Код ' + requestToken);
              return;
            }

            if (!registrationToken) {
              const verifyRes = await fetch('/api/auth/verify-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ phone: rawPhone, code: document.getElementById('otp').value })
              });
              const verifyData = await verifyRes.json();
              if (!verifyRes.ok || verifyData.success !== true) throw new Error(verifyData.message || verifyData.error || 'Неверный код');
              if (verifyData.exists) {
                successDiv.innerText = 'Этот номер уже зарегистрирован в программе лояльности.';
                successDiv.style.display = 'block';
                return;
              }
              registrationToken = verifyData.registrationToken || '';
              if (!registrationToken) throw new Error('Сервер не выдал разрешение на регистрацию');
            }

            const res = await fetch('/api/register-iiko', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + registrationToken },
              body: JSON.stringify({
                name: document.getElementById('name').value,
                phone: rawPhone
              })
            });
            
            const data = await res.json();
            if (res.ok) {
              successDiv.style.display = 'block';
              document.getElementById('regForm').reset();
              document.getElementById('otpBlock').style.display = 'none';
              otpRequested = false;
              registrationToken = '';
            } else {
              throw new Error(data.error || 'Ошибка');
            }
          } catch (err) {
            errorDiv.innerText = err.message;
            errorDiv.style.display = 'block';
          } finally {
            btn.disabled = false;
            btn.innerText = otpRequested ? 'Подтвердить и зарегистрироваться' : 'Получить код в WhatsApp';
          }
        });
      </script>
    </body>
    </html>
