<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171719">
  <meta name="robots" content="noindex, nofollow">
  <title>Продажи блинов по Актау — Bulka</title>
  <link rel="stylesheet" href="/screencakes/screen.css?v=3">
  <script src="/screencakes/screen.js?v=3" defer></script>
</head>
<body>
  <main class="screen">
    <header class="masthead">
      <a class="brand" href="/" aria-label="Bulka — на главную"><img src="/screencakes/logo.png" alt="Bulka" width="152" height="84"></a>
    </header>
    <section aria-labelledby="title">
      <h1 id="title"><span>Продажи блинов</span></h1>
      <div class="metrics" aria-busy="true" id="metrics">
        <article class="metric" aria-labelledby="all-label">
          <div class="food food-one" aria-hidden="true"></div>
          <p class="number" id="all-count">—</p>
          <h2 id="all-label">За весь период</h2>
          <p class="period" id="all-period">Вся доступная история iiko</p>
        </article>
        <article class="metric" aria-labelledby="year-label">
          <div class="food food-two" aria-hidden="true"></div>
          <p class="number" id="year-count">—</p>
          <h2 id="year-label">За этот год</h2>
          <p class="period" id="year-period"></p>
        </article>
        <article class="metric" aria-labelledby="month-label">
          <div class="food food-three" aria-hidden="true"></div>
          <p class="number" id="month-count">—</p>
          <h2 id="month-label">За этот месяц</h2>
          <p class="period" id="month-period"></p>
        </article>
      </div>
    </section>
    <footer class="footer">
      <p class="status" id="status" role="status" aria-live="polite">Получаем данные о продажах…</p>
      <a class="site" href="/">BULKA.COM.KZ</a>
    </footer>
  </main>
</body>
</html>
