<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FAF1E2" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Колесо подарков · Bulka</title>
    <link rel="icon" href="/favicon.png" />
    <link
      rel="preload"
      href="/fortune-assets/fonts/montserrat-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fortune-assets/fonts/montserrat-bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/fortune-assets/fortune.css" />
    <script type="module" src="/fortune-assets/fortune.mjs"></script>
  </head>
  <body>
    <main class="fortune-page">
      <header class="page-header">
        <a class="brand" href="/" aria-label="Bulka — главная">
          <img src="/fortune-assets/bulka-logo.svg" width="564" height="269" alt="Bulka" />
        </a>
        <p id="branch" class="branch"></p>
      </header>
      <h1 id="title">Колесо подарков</h1>
      <div class="wheel-frame" id="wheel-frame" aria-hidden="true">
        <span class="pointer"></span>
        <div class="wheel-surface">
          <canvas id="wheel" width="720" height="720"></canvas>
        </div>
        <span class="wheel-center">
          <img src="/fortune-assets/bulka-logo.svg" width="564" height="269" alt="" />
        </span>
      </div>
      <section class="action-card" aria-label="Участие">
        <p id="status" class="status" role="status" aria-live="polite">Загружаем колесо…</p>
        <p id="error" class="error" role="alert" hidden></p>
        <div id="receipt-step" hidden>
          <label class="button primary upload" for="photo">
            <svg
              viewBox="0 0 24 24"
              width="22"
              height="22"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path
                d="M8 5 9.5 3h5L16 5h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"
              />
              <circle cx="12" cy="12.5" r="3.5" />
            </svg>
            Прикрепить чек
          </label>
          <input
            id="photo"
            type="file"
            accept="image/jpeg,image/png,image/webp"
            capture="environment"
          />
          <p class="hint">Фото чека с QR</p>
        </div>
        <div id="spin-step" hidden>
          <div id="receipt" class="receipt"></div>
          <button id="spin" class="button primary" type="button">Крутить колесо</button>
        </div>
        <div id="result-step" hidden>
          <p id="result-kicker" class="result-kicker">Ваш подарок</p>
          <h2 id="prize"></h2>
          <p id="expiry" class="hint"></p>
          <a id="claim-web" class="button primary" href="/profile?register=1">Забрать приз</a>
          <a id="claim-app" class="button secondary" href="bulka://profile">Открыть в приложении</a>
          <a id="download" class="download" href="/applink">Скачать Bulka</a>
          <button id="new-receipt" class="button secondary" type="button">Другой чек</button>
        </div>
        <details id="previous-prizes" class="previous-prizes" hidden>
          <summary>Мои подарки</summary>
          <div id="previous-prize-list"></div>
        </details>
        <button id="retry" class="button secondary" type="button" hidden>
          Попробовать ещё раз
        </button>
      </section>
    </main>
  </body>
</html>
