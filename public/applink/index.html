<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffb300" />
    <meta
      name="description"
      content="Скачайте мобильное приложение Bulka для iPhone или Android."
    />
    <title>Приложение Bulka</title>
    <link rel="icon" href="/applink/app-icon.png" />

    <main class="page">
      <section class="download-card" aria-labelledby="download-title">

            <img src="/applink/app-icon.png" alt="" width="104" height="104" />
          </div>
          <p class="eyebrow">Мобильное приложение</p>
          <h1 id="download-title">Bulka всегда рядом</h1>
          <p class="lead">
            Заказывайте любимую выпечку, получайте бонусы и следите за новыми предложениями.
          </p>
          <div class="platforms" aria-label="Выберите платформу">
            <a
              class="store-button"
              data-platform="ios"
              href="https://apps.apple.com/app/id6811576637"
              rel="noopener noreferrer"
            >
              <svg class="apple-logo" viewBox="0 0 32 40" aria-hidden="true">
                <path
                  fill="currentColor"
                  d="M26.7 20.2c0-5.1 4.2-7.5 4.4-7.6-2.4-3.5-6.1-4-7.4-4-3.1-.3-6.2 1.9-7.8 1.9-1.7 0-4.2-1.9-6.9-1.8-3.5.1-6.8 2.1-8.6 5.2-3.7 6.4-.9 15.8 2.6 21 1.8 2.5 3.8 5.3 6.5 5.2 2.6-.1 3.6-1.7 6.8-1.7 3.1 0 4.1 1.7 6.8 1.6 2.9 0 4.7-2.5 6.4-5.1 2-2.9 2.8-5.8 2.8-6-.1 0-5.6-2.2-5.6-8.7ZM21.7 5.3C23.1 3.5 24.1 1 23.8-1.5c-2.1.1-4.8 1.5-6.3 3.3-1.3 1.5-2.5 4.1-2.2 6.5 2.4.2 4.8-1.2 6.4-3Z"
                />
              </svg>
              <span><small>Загрузите в</small><strong>App Store</strong></span>
            </a>
            <a
              class="store-button"
              data-platform="android"
              href="https://play.google.com/store/apps/details?id=com.bulka.bonus"
              rel="noopener noreferrer"
            >
              <svg class="play-logo" viewBox="0 0 44 48" aria-hidden="true">
                <path
                  fill="#00d2ff"
                  d="M2.5 1.8A5 5 0 0 0 1 5.4v37.2a5 5 0 0 0 1.5 3.6L24 24 2.5 1.8Z"
                />
                <path fill="#00f076" d="m24 24 7.2-7.4L7 2.5a5.2 5.2 0 0 0-4.5-.7L24 24Z" />
                <path fill="#ffda00" d="m24 24-21.5 22.2a5.2 5.2 0 0 0 4.5-.7l24.2-14.1L24 24Z" />
                <path
                  fill="#ff3a44"
                  d="M41 21.1 31.2 16.6 24 24l7.2 7.4 9.8-4.5c2.7-1.3 2.7-4.5 0-5.8Z"
                />

            </a>

          <p class="hint">Выберите магазин для вашего телефона</p>
        </div>
      </section>

    <script src="/applink/app.js" defer></script>

</html>
