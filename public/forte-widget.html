<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex,nofollow,noarchive" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png?v=20260908-transparent" />
    <title>Оплата картой — Bulka</title>
    <link rel="stylesheet" href="/assets/forte-widget.css?v=5" />
    <script defer src="https://js.fortebank.com/widget/be_gateway.js"></script>
    <script defer src="/assets/forte-widget.js?v=6"></script>
    <link rel="stylesheet" href="/assets/brand/bulka-controls.css?v=bulka-premium-1" />
  </head>
  <body>
    <div class="payment-backdrop">
      <div class="phone-frame">
        <span class="phone-speaker" aria-hidden="true"></span>
        <div class="phone-screen">
          <header class="payment-header">
            <button class="close-button" id="close-payment" type="button" aria-label="Закрыть">
              <svg
                class="bulka-icon"
                viewBox="0 0 24 24"
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
                focusable="false"
              >
                <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#X" />
              </svg>
            </button>
            <img
              class="bulka-logo"
              src="/app/assets/assets/brand/bulka_logo.png"
              width="62"
              height="32"
              alt="Bulka"
            />
            <span class="header-divider" aria-hidden="true"></span>
            <strong id="page-title">Оплата картой</strong>
          </header>

          <div class="secure-strip">
            <svg
              class="bulka-icon secure-icon"
              viewBox="0 0 24 24"
              aria-hidden="true"
              focusable="false"
            >
              <use href="/assets/brand/bulka-icons.svg?v=bulka-premium-1#LockKeyhole" />
            </svg>
            <span id="secure-label">Защищённая страница банка</span>
          </div>

          <main>
            <section class="payment-state" id="payment-state" aria-live="polite">
              <div class="spinner" aria-hidden="true"></div>
              <h1 id="state-title">Открываем безопасную оплату</h1>
              <p id="state-message">Не закрывайте страницу. Данные карты обрабатывает ForteBank.</p>
              <button class="back-button primary" id="back-to-orders" type="button" hidden>
                Вернуться к заказам
              </button>
            </section>
          </main>

          <footer>
            <span>Visa</span>
            <span>Mastercard</span>
            <span>Google Pay</span>
          </footer>
        </div>
      </div>
    </div>
  </body>
</html>
