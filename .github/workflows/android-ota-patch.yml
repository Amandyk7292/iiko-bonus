name: Android OTA patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Installed Shorebird release (for example 1.0.10+2026100601)
        required: true
        type: string
      track:
        description: Publish to stable customers or staging devices
        required: true
        type: choice
        options: [staging, stable]
        default: stable

permissions:
  contents: read

concurrency:
  group: android-ota-patch
  cancel-in-progress: false

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BulkaAndroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=2

  patch:
    needs: verify
    # A clean Actions Windows path avoids the spaces in the local user profile
    # that broke Flutter native-asset tooling, without bypassing Shorebird's
    # normal asset compatibility check.
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BulkaAndroid
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      PATCH_TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate release and credentials
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$') {
            throw 'Invalid Shorebird release version.'
          if ([string]::IsNullOrWhiteSpace($env:SHOREBIRD_TOKEN)) {
            throw 'Missing Shorebird authentication.'
          }
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          cache: true
      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5
        with:
          cache: true
      - name: Create temporary Android build signing key
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path 'android/keystore' | Out-Null
          keytool -genkeypair -v `
            -keystore android/keystore/ci-release.jks `
            -storepass ci-release-password `
            -alias bulka-ci `
            -keypass ci-release-password `
            -keyalg RSA `
            -keysize 2048 `
            -validity 2 `
            -dname 'CN=Bulka CI, OU=Engineering, O=Bulka, L=Astana, C=KZ'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          storeFile=keystore/ci-release.jks
          storePassword=ci-release-password
          keyAlias=bulka-ci
          keyPassword=ci-release-password
          '@ | Set-Content -Path 'android/key.properties' -Encoding ascii
      - run: flutter pub get
      - name: Build and publish compatible patch
        shell: pwsh
        run: |
          $versionParts = $env:RELEASE_VERSION -split '\+', 2
          $shorebirdArgs = @(
            'patch', 'android',
            "--release-version=$env:RELEASE_VERSION",
            "--track=$env:PATCH_TRACK",
            "--build-name=$($versionParts[0])",
            "--build-number=$($versionParts[1])",
            '--dart-define=BULKA_API_BASE_URL=https://bulka.com.kz'
          )
          & shorebird @shorebirdArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Remove temporary signing materials
        if: always()
        shell: pwsh
        run: |
          $root = (Resolve-Path '.').Path
          $separator = [IO.Path]::DirectorySeparatorChar
          $targets = @(
            (Join-Path $root 'android/keystore'),
            (Join-Path $root 'android/key.properties')
          )
          foreach ($target in $targets) {
            $resolvedTarget = [IO.Path]::GetFullPath($target)
            if (-not $resolvedTarget.StartsWith($root + $separator, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Refusing to remove a signing path outside the Android workspace.'
            }
            if (Test-Path -LiteralPath $resolvedTarget) {
              Remove-Item -LiteralPath $resolvedTarget -Recurse -Force
            }
          }
