name: iOS OTA patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Installed Shorebird release (for example 1.0.7+42)
        required: true
        type: string
      track:
        description: Staging for device verification; stable for customers
        type: choice
        options: [staging, stable]
        default: staging

permissions:
  contents: read

concurrency:
  group: iphone-ota-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BulkaAndroid
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_STORE_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_STORE_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE: ${{ secrets.IOS_STORE_APP_PROFILE }}
      IOS_WIDGET_PROFILE: ${{ secrets.IOS_STORE_WIDGET_PROFILE }}
      IOS_FIREBASE_PLIST: ${{ secrets.IOS_FIREBASE_PLIST }}
      IOS_DISTRIBUTION: appstore
      BUILD_MODE: release
      RELEASE_VERSION: ${{ inputs.release_version }}
      PATCH_TRACK: ${{ inputs.track }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release and credentials
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          for name in SHOREBIRD_TOKEN IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_APP_PROFILE IOS_WIDGET_PROFILE IOS_FIREBASE_PLIST; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Prepare temporary signing keychain
        run: python3 ../scripts/prepare-ios-device-signing.py
      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      - name: Apply profiles to app and widget targets
        run: ruby ../scripts/apply-ios-device-profiles.rb
      - name: Build and publish compatible patch
        run: |
          shorebird patch ios --release-version="$RELEASE_VERSION" \
            --track="$PATCH_TRACK" \
            --build-name="${RELEASE_VERSION%+*}" \
            --build-number="${RELEASE_VERSION##*+}" \
            --export-options-plist="$RUNNER_TEMP/bulka-signing/ExportOptions.plist" \
            --dart-define=BULKA_API_BASE_URL=https://bulka.com.kz
      - name: Remove temporary signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bulka-signing/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/bulka-signing"
