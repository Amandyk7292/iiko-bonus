name: iOS OTA patch

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Installed Shorebird release (for example 1.0.7+42)
        required: true
        type: string
      track:
        description: Staging for device verification; stable for customers
        type: choice
        options: [staging, stable]
        default: staging
      allow_reviewed_icon_removal:
        description: Preserve the installed font for the reviewed stock-label patch only
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: iphone-ota-patch
  cancel-in-progress: false

jobs:
  verify:
    # Pixel baselines are generated on Windows. Run the complete test suite
    # with that renderer, then require its success before the Mac build.
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: BulkaAndroid
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub --concurrency=2
  patch:
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: BulkaAndroid
    env:
      SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
      IOS_CERTIFICATE_P12: ${{ secrets.IOS_STORE_CERTIFICATE_P12 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_STORE_CERTIFICATE_PASSWORD }}
      IOS_APP_PROFILE: ${{ secrets.IOS_STORE_APP_PROFILE }}
      IOS_WIDGET_PROFILE: ${{ secrets.IOS_STORE_WIDGET_PROFILE }}
      IOS_FIREBASE_PLIST: ${{ secrets.IOS_FIREBASE_PLIST }}
      IOS_DISTRIBUTION: appstore
      BUILD_MODE: release
      RELEASE_VERSION: ${{ inputs.release_version }}
      PATCH_TRACK: ${{ inputs.track }}
      ALLOW_REVIEWED_ICON_REMOVAL: ${{ inputs.allow_reviewed_icon_removal }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate release and credentials
        run: |
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]
          for name in SHOREBIRD_TOKEN IOS_CERTIFICATE_P12 IOS_CERTIFICATE_PASSWORD IOS_APP_PROFILE IOS_WIDGET_PROFILE IOS_FIREBASE_PLIST; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing secret: $name"
              exit 1
            fi
          done
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - uses: shorebirdtech/setup-shorebird@4dd9d7dc2d7930bfeadb053b6e94b5110779d1e5 # v1
        with:
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-pub
      - name: Prepare temporary signing keychain
        run: python3 ../scripts/prepare-ios-device-signing.py
      - name: Install CocoaPods dependencies
        run: cd ios && pod install
      - name: Apply profiles to app and widget targets
        run: ruby ../scripts/apply-ios-device-profiles.rb
      - name: Build and publish compatible patch
        run: |
          extra_args=()
          if [[ "$ALLOW_REVIEWED_ICON_REMOVAL" == "true" ]]; then
            # Run 36128398260 verified the only asset diff is MaterialIcons.
            # Compared with the release, this tree removes Icons.add_alert_rounded and
            # Icons.notifications_active_rounded. The installed font contains
            # all remaining glyphs. The smoothness changes preserve the icon
            # inventory and touch no assets, native files, or dependencies.
            # Fail closed for any other app source tree.
            if [[ "$RELEASE_VERSION" != "1.0.8+43" || "$(git rev-parse HEAD:BulkaAndroid)" != "2440ac95d6b8b4ef12ddaa5bc3ffe4ccf74baa7c" ]]; then
              echo "::error::Icon-removal exception requires the reviewed 1.0.8+43 app tree."
              exit 1
            fi
            extra_args+=(--allow-asset-diffs)
          fi
          shorebird patch ios --release-version="$RELEASE_VERSION" \
            "${extra_args[@]}" \
            --track="$PATCH_TRACK" \
            --build-name="${RELEASE_VERSION%+*}" \
            --build-number="${RELEASE_VERSION##*+}" \
            --export-options-plist="$RUNNER_TEMP/bulka-signing/ExportOptions.plist" \
            --dart-define=BULKA_API_BASE_URL=https://bulka.com.kz
      - name: Remove temporary signing materials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bulka-signing/build.keychain-db" || true
          rm -rf "$RUNNER_TEMP/bulka-signing"
