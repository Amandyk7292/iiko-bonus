name: App Store screenshots
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: BulkaAndroid
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          cache: true
      - run: flutter pub get
      - name: Configure Firebase
        env:
          FIREBASE_PLIST: ${{ secrets.IOS_FIREBASE_PLIST }}
        run: echo "$FIREBASE_PLIST" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Capture iPhone and iPad
        run: python3 ../scripts/capture-store-simulators.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulka-store-screenshots
          path: BulkaAndroid/store-screenshots/
          retention-days: 7
