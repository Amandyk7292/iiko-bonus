name: iOS release status

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: macos-latest
    timeout-minutes: 5
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Read App Store versions and build processing
        run: ruby scripts/ios-store-status.rb
