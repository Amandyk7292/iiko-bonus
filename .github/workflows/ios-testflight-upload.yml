name: Upload iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Successful App Store IPA workflow run ID
        type: string
        required: true
      expected_source_sha:
        description: Full reviewed source commit used by the App Store IPA build
        type: string
        required: true

permissions:
  contents: read
  actions: read

jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id }}
      EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify source workflow and artifact identity
        run: |
          python3 - <<'PY'
          import importlib.util, json, os, re, urllib.request
          from pathlib import Path
          if os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise SystemExit('App Store uploads must run from main')
          run_id = os.environ['ARTIFACT_RUN_ID']
          if not re.fullmatch(r'[1-9][0-9]*', run_id):
              raise SystemExit('Expected a numeric build workflow run ID')
          spec = importlib.util.spec_from_file_location('verify_ipa', Path('scripts/verify-ios-device-ipa.py'))
          verifier = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verifier)
          repo = os.environ['GITHUB_REPOSITORY']
          def read(path):
              request = urllib.request.Request(f'https://api.github.com/repos/{repo}/{path}', headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          run = read(f'actions/runs/{run_id}')
          artifacts = read(f'actions/runs/{run_id}/artifacts?per_page=100')['artifacts']
          verifier.validate_source_run(run, artifacts, os.environ['EXPECTED_SOURCE_SHA'], repo, run_id)
          PY
      - name: Check App Store Connect credentials
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing App Store Connect secret: $name"
              exit 1
            fi
          done

      - uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4
        with:
          name: bulka-iphone-appstore-release-${{ inputs.expected_source_sha }}
          path: artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.artifact_run_id }}

      - name: Verify IPA provenance and OTA contents before upload
        run: |
          python3 scripts/verify-ios-device-ipa.py artifact \
            --expected-bundle-id com.bulka.bonus --verify-provenance \
            --source-commit="$EXPECTED_SOURCE_SHA" --run-id="$ARTIFACT_RUN_ID" \
            --repository="$GITHUB_REPOSITORY"

      - name: Prepare App Store Connect API key
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          value = os.environ['ASC_PRIVATE_KEY'].strip()
          if 'BEGIN PRIVATE KEY' in value:
              payload = value.encode()
          else:
              payload = base64.b64decode(value, validate=True)
          target = Path.home() / '.appstoreconnect/private_keys' / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"
          target.write_bytes(payload)
          target.chmod(0o600)
          PY

      - name: Upload IPA to TestFlight
        run: |
          IPA_COUNT="$(find artifact -type f -name '*.ipa' | wc -l | tr -d ' ')"
          test "$IPA_COUNT" = 1
          IPA="$(find artifact -type f -name '*.ipa' -print -quit)"
          test -n "$IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove App Store Connect API key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys"
