name: Upload App Store build
on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful App Store build run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  upload:
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
          pattern: bulka-appstore-release-*
          path: ipa
          merge-multiple: true
      - name: Validate artifact and prepare upload key
        run: |
          set -euo pipefail
          test -n "$ASC_KEY_ID"
          test -n "$ASC_ISSUER_ID"
          test -n "$ASC_PRIVATE_KEY"
          python3 - <<'PY'
          import os, pathlib, base64, hashlib, plistlib, zipfile
          packages=list(pathlib.Path('ipa').glob('*.ipa'))
          assert len(packages)==1, 'Expected one IPA'
          package=packages[0]
          checksums=(pathlib.Path('ipa')/'SHA256SUMS').read_text()
          assert hashlib.sha256(package.read_bytes()).hexdigest() in checksums
          with zipfile.ZipFile(package) as archive:
              info=plistlib.loads(archive.read('Payload/Runner.app/Info.plist'))
              assert info['CFBundleIdentifier']=='com.bulka.bonus'
              print('Uploading Bulka',info['CFBundleShortVersionString'],info['CFBundleVersion'])
          folder=pathlib.Path.home()/'.appstoreconnect/private_keys'
          folder.mkdir(parents=True, exist_ok=True)
          key=folder/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          key.write_bytes(base64.b64decode(os.environ['ASC_PRIVATE_KEY'],validate=True))
          key.chmod(0o600)
          PY
      - name: Upload to App Store Connect
        run: |
          set -euo pipefail
          xcrun altool --upload-app -f ipa/*.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove temporary upload key
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib
          key=pathlib.Path.home()/'.appstoreconnect/private_keys'/('AuthKey_'+os.environ['ASC_KEY_ID']+'.p8')
          key.unlink(missing_ok=True)
          PY
