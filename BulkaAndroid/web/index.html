<!DOCTYPE html>
<html lang="ru">
<head>
  <script>
    (function () {
      var supported = ['ru', 'kk', 'en'];
      var saved = localStorage.getItem('flutter.app_lang_code');
      if (saved && saved.charAt(0) === '"') {
        try { saved = JSON.parse(saved); } catch (_) {}
      }
      var browserLanguage = (navigator.language || 'ru').split('-')[0];
      var locale = supported.indexOf(saved) >= 0
        ? saved
        : supported.indexOf(browserLanguage) >= 0
        ? browserLanguage
        : 'ru';
      document.documentElement.lang = locale;
      var metadata = {
        ru: {
          title: 'Bulka — семейная пекарня',
          description: 'Заказывайте свежую выпечку, десерты и любимые блюда Bulka с доставкой или самовывозом в Астане и Актау.',
          imageAlt: 'Оригинальный логотип семейной пекарни Bulka'
        },
        kk: {
          title: 'Bulka — отбасылық наубайхана',
          description: 'Астана мен Ақтауда Bulka-ның жаңа піскен өнімдерін, десерттері мен сүйікті тағамдарын жеткізумен немесе алып кетуге тапсырыс беріңіз.',
          imageAlt: 'Bulka отбасылық наубайханасының түпнұсқа логотипі'
        },
        en: {
          title: 'Bulka — family bakery',
          description: 'Order fresh pastries, desserts and Bulka favourites for delivery or pickup in Astana and Aktau.',
          imageAlt: 'Original Bulka family bakery logo'
        }
      };
      document.addEventListener('DOMContentLoaded', function () {
        var copy = metadata[locale];
        document.title = copy.title;
        [
          ['meta[name="description"]', 'content', copy.description],
          ['meta[property="og:title"]', 'content', copy.title],
          ['meta[property="og:description"]', 'content', copy.description],
          ['meta[property="og:image:alt"]', 'content', copy.imageAlt],
          ['meta[name="twitter:title"]', 'content', copy.title],
          ['meta[name="twitter:description"]', 'content', copy.description]
        ].forEach(function (entry) {
          var element = document.querySelector(entry[0]);
          if (element) element.setAttribute(entry[1], entry[2]);
        });
      }, { once: true });
    })();
  </script>

  <style>
    @font-face {
      font-family: "Montserrat";
      src: url("assets/assets/fonts/Montserrat-Regular-subset.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Montserrat";
      src: url("assets/assets/fonts/Montserrat-SemiBold-subset.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
      font-display: swap;
    }

    html, body {
      color-scheme: light;
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #fff;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      touch-action: manipulation;
    }

    flutter-view,
    flt-glass-pane,
    canvas {
      background-color: #fff;
    }

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      overflow: hidden;
      isolation: isolate;
      pointer-events: auto;
      background: #fff;
      color: #532814;
      font-family: "Montserrat";
      transition: opacity 220ms ease;
    }

    #app-loading.is-ready {
      opacity: 0;
    }

    .app-loading-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 1;
      width: min(88vw, 360px);
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
    }

    .app-loading-logo {
      display: block;
      flex: 0 0 auto;
      width: 184px;
      max-width: 100%;
      height: auto;
      animation: app-logo-pulse 4.5s ease-in-out infinite;
      transform-origin: center;
    }

    #app-loading.is-error {
      pointer-events: auto;
    }

    #app-loading.is-error .app-loading-logo {
      animation: none;
    }

    .app-loading-error {
      width: min(88vw, 360px);
      text-align: center;
      color: #532814;
    }

    .app-loading-error[hidden] {
      display: none;
    }

    .app-loading-error-title {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1.35;
    }

    .app-loading-error-copy {
      margin: 0 0 16px;
      color: #6f625c;
      font-size: 14px;
      line-height: 1.5;
    }

    .app-loading-retry {
      min-width: 148px;
      min-height: 48px;
      padding: 12px 20px;
      border: 1px solid #532814;
      border-radius: 18px;
      background: #ffb814;
      color: #532814;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .app-loading-retry:focus-visible {
      outline: 3px solid #8a3f1e;
      outline-offset: 3px;
    }

    @keyframes app-logo-pulse {
      0%, 100% { transform: scale(0.96); opacity: 0.92; }
      50% { transform: scale(1.05); opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      #app-loading { transition: none; }
      .app-loading-logo { animation: none; }
    }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <div class="app-loading-content">
      <img class="app-loading-logo" src="assets/assets/brand/bulka_logo.png?v=20260719-1" alt="Bulka">
      <div id="app-loading-error" class="app-loading-error" role="alert" hidden>
        <p id="app-loading-error-title" class="app-loading-error-title"></p>
        <p id="app-loading-error-copy" class="app-loading-error-copy"></p>
        <button id="app-loading-retry" class="app-loading-retry" type="button"></button>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const copy = {
        ru: {
          title: 'Не удалось запустить приложение',
          body: 'Проверьте подключение к интернету и попробуйте ещё раз.',
          retry: 'Попробовать снова',
        },
        kk: {
          title: 'Қолданбаны іске қосу мүмкін болмады',
          body: 'Интернет байланысын тексеріп, әрекетті қайталаңыз.',
          retry: 'Қайта көру',
        },
        en: {
          title: 'The app could not start',
          body: 'Check your internet connection and try again.',
          retry: 'Try again',
        },
      };
      const language = (document.documentElement.lang || 'ru').toLowerCase();
      const locale = language.startsWith('kk') || language.startsWith('kz')
        ? 'kk'
        : language.startsWith('en')
          ? 'en'
          : 'ru';
      const loadingTimeout = window.setTimeout(() => {
        const loading = document.getElementById('app-loading');
        const error = document.getElementById('app-loading-error');
        if (!loading || !error) return;
        document.getElementById('app-loading-error-title').textContent = copy[locale].title;
        document.getElementById('app-loading-error-copy').textContent = copy[locale].body;
        const retry = document.getElementById('app-loading-retry');
        retry.textContent = copy[locale].retry;
        retry.addEventListener('click', () => window.location.reload(), { once: true });
        error.hidden = false;
        loading.classList.add('is-error');
      }, 12000);
      const hideLoading = () => {
        window.clearTimeout(loadingTimeout);
        const loading = document.getElementById('app-loading');
        if (!loading) return;
        loading.classList.add('is-ready');
        window.setTimeout(() => loading.remove(), 240);
      };
      window.addEventListener('flutter-first-frame', hideLoading, { once: true });
    })();
  </script>
  <script src="app_bootstrap.js?v=__BULKA_RELEASE_VERSION__"></script>
</body>
