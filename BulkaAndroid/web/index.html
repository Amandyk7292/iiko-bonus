<!doctype html>
<html lang="ru">
  <head>
    <script>
      (function () {
        var agent = navigator.userAgent || '';
        var platform = navigator.platform || '';
        var touchPoints = navigator.maxTouchPoints || 0;
        var isTablet =
          touchPoints > 1 &&
          (/iPad/i.test(agent) ||
            (platform === 'MacIntel' && touchPoints > 1) ||
            (/Android/i.test(agent) && !/Mobile/i.test(agent)));
        if (isTablet) document.documentElement.classList.add('bulka-tablet');

        var supported = ['ru', 'kk', 'en'];
        var saved = localStorage.getItem('flutter.app_lang_code');
        if (saved && saved.charAt(0) === '"') {
          try {
            saved = JSON.parse(saved);
          } catch (_) {}
        }
        var browserLanguage = (navigator.language || 'ru').split('-')[0];
        var locale =
          supported.indexOf(saved) >= 0
            ? saved
            : supported.indexOf(browserLanguage) >= 0
              ? browserLanguage
              : 'ru';
        document.documentElement.lang = locale;
        var metadata = {
          ru: {
            title: 'Bulka — семейная пекарня',
            description:
              'Заказывайте свежую выпечку, десерты и любимые блюда Bulka с доставкой или самовывозом в Астане и Актау.',
            imageAlt: 'Оригинальный логотип семейной пекарни Bulka',
          },
          kk: {
            title: 'Bulka — отбасылық наубайхана',
            description:
              'Астана мен Ақтауда Bulka-ның жаңа піскен өнімдерін, десерттері мен сүйікті тағамдарын жеткізумен немесе алып кетуге тапсырыс беріңіз.',
            imageAlt: 'Bulka отбасылық наубайханасының түпнұсқа логотипі',
          },
          en: {
            title: 'Bulka — family bakery',
            description:
              'Order fresh pastries, desserts and Bulka favourites for delivery or pickup in Astana and Aktau.',
            imageAlt: 'Original Bulka family bakery logo',
          },
        };
        document.addEventListener(
          'DOMContentLoaded',
          function () {
            var copy = metadata[locale];
            document.title = copy.title;
            [
              ['meta[name="description"]', 'content', copy.description],
              ['meta[property="og:title"]', 'content', copy.title],
              ['meta[property="og:description"]', 'content', copy.description],
              ['meta[property="og:image:alt"]', 'content', copy.imageAlt],
              ['meta[name="twitter:title"]', 'content', copy.title],
              ['meta[name="twitter:description"]', 'content', copy.description],
            ].forEach(function (entry) {
              var element = document.querySelector(entry[0]);
              if (element) element.setAttribute(entry[1], entry[2]);
            });
          },
          { once: true },
        );
      })();
    </script>
