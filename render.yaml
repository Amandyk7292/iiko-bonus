services:
  - type: web
    name: iiko-bonus
    runtime: node
    buildCommand: npm ci && npm ci --prefix admin-ui && npm run build:admin
    startCommand: npm start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: PUBLIC_BASE_URL
        value: https://bulka.com.kz
      - key: APPLE_TEAM_ID
        value: GKRRT4JU9G
      - key: APPLE_BUNDLE_ID
        value: com.bulka.bonus
      - key: ALLOWED_ORIGINS
        value: https://bulka.com.kz
      - key: FORTE_ENABLED
        value: 'false'
      - key: FORTE_TEST_MODE
        value: 'false'
      - key: FORTE_API_BASE_URL
        value: https://api.fortebank.com
      - key: RUN_BACKGROUND_WORKERS
        value: 'false'
      - key: RUN_BOTS
        value: 'false'
      - key: GEMINI_ASSISTANT_ENABLED
        value: 'false'
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: API_SECRET
        generateValue: true
      - key: BULKA_SECRET
        generateValue: true
      - key: CUSTOMER_JWT_SECRET
        generateValue: true
      - key: RECEIPT_SIGNING_SECRET
        generateValue: true
      - key: ADMIN_USERS_JSON
        sync: false
      - key: ADMIN_REQUIRE_MFA
        value: 'true'
      - key: IIKO_API_LOGIN
        sync: false
      - key: IIKO_APP_ID
        sync: false
      - key: IIKO_CLIENT_SECRET
        sync: false
      - key: IIKO_ORGANIZATION_ID
        sync: false
      - key: IIKO_TERMINAL_GROUP_ID
        sync: false
      - key: IIKO_TERMINAL_GROUPS_JSON
        sync: false
      - key: FORTE_API_USERNAME
        sync: false
      - key: FORTE_API_PASSWORD
        sync: false
      - key: FORTE_ORDER_CREDENTIAL_KEY
        sync: false
      - key: FORTE_MERCHANT_ID
        sync: false
