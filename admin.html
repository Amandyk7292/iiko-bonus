<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iiko Bonus CRM & Analytics</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; }
    .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .gradient-text { background: linear-gradient(to right, #38bdf8, #818cf8); -webkit-background-clip: text; color: transparent; }
    input, select { background: #0f172a; border: 1px solid #334155; color: white; transition: all 0.3s; }
    input:focus, select:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    .btn-glow { background: linear-gradient(to right, #38bdf8, #818cf8); transition: all 0.3s; }
    .btn-glow:hover { box-shadow: 0 0 15px rgba(56, 189, 248, 0.5); transform: translateY(-1px); }
    .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; }
    .tab-inactive { color: #94a3b8; }
    .tab-inactive:hover { color: #e2e8f0; }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">
  
  <!-- Modal Auth -->
  <div id="authModal" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50 transition-opacity duration-300">
    <div class="glass p-8 rounded-2xl w-full max-w-sm text-center transform transition-transform scale-100">
      <h2 class="text-2xl font-bold mb-6 gradient-text">Авторизация</h2>
      <input type="password" id="adminPwd" placeholder="Пароль администратора" class="w-full px-4 py-3 rounded-xl mb-4 text-center text-lg tracking-widest">
      <button onclick="login()" class="btn-glow w-full py-3 rounded-xl font-bold text-white shadow-lg">Войти</button>
      <p id="authError" class="text-red-400 mt-4 hidden text-sm">Неверный пароль</p>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboard" class="w-full max-w-6xl mx-auto glass rounded-3xl hidden overflow-hidden flex flex-col min-h-[80vh]">
    <!-- Header -->
    <div class="p-6 border-b border-slate-700 flex justify-between items-center">
      <h1 class="text-2xl md:text-3xl font-extrabold gradient-text">Bonus System CRM</h1>
      <button onclick="logout()" class="text-slate-400 hover:text-white transition">Выйти</button>
    </div>

    <!-- Navigation Tabs -->
    <div class="flex border-b border-slate-700 px-6">
      <button onclick="switchTab('analytics')" id="tab-analytics" class="px-4 py-3 font-semibold tab-active">Аналитика</button>
      <button onclick="switchTab('customers')" id="tab-customers" class="px-4 py-3 font-semibold tab-inactive">Клиенты</button>
      <button onclick="switchTab('transactions')" id="tab-transactions" class="px-4 py-3 font-semibold tab-inactive">Транзакции</button>
      <button onclick="switchTab('settings')" id="tab-settings" class="px-4 py-3 font-semibold tab-inactive">Настройки</button>
    </div>

    <!-- Content Area -->
    <div class="p-6 flex-1 overflow-auto">
      
      <!-- TAB: Analytics -->
      <div id="content-analytics" class="space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
          <div class="glass p-4 rounded-xl">
            <p class="text-slate-400 text-sm">Всего клиентов</p>
            <p class="text-3xl font-bold text-white" id="stat-customers">-</p>
          </div>
          <div class="glass p-4 rounded-xl">
            <p class="text-slate-400 text-sm">Оборот (тнг)</p>
            <p class="text-3xl font-bold text-emerald-400" id="stat-sales">-</p>
          </div>
          <div class="glass p-4 rounded-xl">
            <p class="text-slate-400 text-sm">Выдано бонусов</p>
            <p class="text-3xl font-bold text-sky-400" id="stat-earned">-</p>
          </div>
          <div class="glass p-4 rounded-xl">
            <p class="text-slate-400 text-sm">Потрачено бонусов</p>
            <p class="text-3xl font-bold text-red-400" id="stat-burned">-</p>
          </div>
        </div>
        <div class="glass p-4 rounded-xl w-full h-80 flex items-center justify-center text-slate-500">
           <!-- Placeholder for Chart.js -->
           <canvas id="myChart"></canvas>
        </div>
      </div>

      <!-- TAB: Customers -->
      <div id="content-customers" class="hidden space-y-4">
        <div class="flex justify-between items-center">
          <input type="text" id="searchCustomer" onkeyup="renderCustomers()" placeholder="Поиск по телефону или имени..." class="px-4 py-2 rounded-lg w-full max-w-sm">
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700 text-slate-400">
                <th class="py-3 px-4">Имя</th>
                <th class="py-3 px-4">Телефон</th>
                <th class="py-3 px-4 text-right">Баланс</th>
                <th class="py-3 px-4 text-right">Покупки</th>
                <th class="py-3 px-4 text-center">Действия</th>
              </tr>
            </thead>
            <tbody id="customersTable" class="text-sm"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: Transactions -->
      <div id="content-transactions" class="hidden space-y-4">
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="border-b border-slate-700 text-slate-400">
                <th class="py-3 px-4">Дата</th>
                <th class="py-3 px-4">Клиент</th>
                <th class="py-3 px-4">Тип</th>
                <th class="py-3 px-4 text-right">Сумма бонусов</th>
              </tr>
            </thead>
            <tbody id="transactionsTable" class="text-sm"></tbody>
          </table>
        </div>
      </div>

      <!-- TAB: Settings -->
      <div id="content-settings" class="hidden space-y-6 max-w-2xl">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="glass p-5 rounded-2xl">
            <label class="block text-sm text-slate-300 mb-2 font-semibold">Базовый кэшбэк (%)</label>
            <input type="number" id="base_cashback_percent" class="w-full px-4 py-2 rounded-lg text-xl font-bold">
          </div>
          
          <div class="glass p-5 rounded-2xl relative overflow-hidden">
            <div class="absolute top-0 right-0 w-16 h-16 bg-yellow-500 rounded-full filter blur-2xl opacity-20"></div>
            <label class="block text-sm text-yellow-300 mb-2 font-semibold flex items-center">
              VIP кэшбэк (%) <span class="ml-2 text-xs bg-yellow-500/20 px-2 py-0.5 rounded-full">PRO</span>
            </label>
            <input type="number" id="vip_cashback_percent" class="w-full px-4 py-2 rounded-lg text-xl font-bold">
          </div>
        </div>

        <div class="glass p-5 rounded-2xl">
          <label class="block text-sm text-slate-300 mb-2 font-semibold">Сумма трат для статуса VIP (тнг)</label>
          <input type="number" id="vip_threshold" class="w-full px-4 py-2 rounded-lg text-xl font-bold text-green-400">
        </div>

        <div class="glass p-5 rounded-2xl">
          <label class="block text-sm text-slate-300 mb-2 font-semibold">Лимит оплаты бонусами (%)</label>
          <input type="number" id="max_discount_percent" class="w-full px-4 py-2 rounded-lg text-xl font-bold text-red-400">
        </div>

        <button onclick="saveSettings()" id="saveBtn" class="mt-4 btn-glow w-full py-4 rounded-2xl font-bold text-white text-lg shadow-[0_0_20px_rgba(56,189,248,0.3)]">
          Сохранить настройки
        </button>
        <p id="saveMsg" class="text-center mt-2 text-emerald-400 font-semibold hidden">Настройки успешно сохранены!</p>
      </div>

    </div>
  </div>

  <script>
    let token = localStorage.getItem('adminToken') || '';
    let currentData = { customers: [], transactions: [], stats: {} };
    let chartInstance = null;

    if(token) initApp();

    async function login() {
      token = document.getElementById('adminPwd').value;
      const success = await fetchSettings();
      if(success) {
        localStorage.setItem('adminToken', token);
        document.getElementById('authModal').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        initApp();
      } else {
        document.getElementById('authError').classList.remove('hidden');
      }
    }

    function logout() {
      localStorage.removeItem('adminToken');
      location.reload();
    }

    async function initApp() {
      document.getElementById('authModal').classList.add('hidden');
      document.getElementById('dashboard').classList.remove('hidden');
      await Promise.all([fetchSettings(), fetchStats(), fetchCustomers(), fetchTransactions()]);
      renderChart();
    }

    function switchTab(tabId) {
      ['analytics', 'customers', 'transactions', 'settings'].forEach(id => {
        document.getElementById('content-' + id).classList.add('hidden');
        document.getElementById('tab-' + id).className = 'px-4 py-3 font-semibold tab-inactive';
      });
      document.getElementById('content-' + tabId).classList.remove('hidden');
      document.getElementById('tab-' + tabId).className = 'px-4 py-3 font-semibold tab-active';
    }

    // --- API Calls ---
    async function apiGet(endpoint) {
      const res = await fetch('/admin/api/' + endpoint, { headers: { 'Authorization': 'Bearer ' + token } });
      if(!res.ok) throw new Error('Auth failed');
      return await res.json();
    }

    async function fetchSettings() {
      try {
        const data = await apiGet('settings');
        document.getElementById('base_cashback_percent').value = data.base_cashback_percent;
        document.getElementById('vip_cashback_percent').value = data.vip_cashback_percent;
        document.getElementById('vip_threshold').value = data.vip_threshold;
        document.getElementById('max_discount_percent').value = data.max_discount_percent;
        return true;
      } catch (e) { return false; }
    }

    async function fetchStats() {
      try {
        const data = await apiGet('stats');
        document.getElementById('stat-customers').innerText = data.totalCustomers;
        document.getElementById('stat-sales').innerText = data.totalSales.toLocaleString();
        document.getElementById('stat-earned').innerText = data.totalEarned.toLocaleString();
        document.getElementById('stat-burned').innerText = data.totalBurned.toLocaleString();
        currentData.stats = data;
      } catch (e) { console.error(e); }
    }

    async function fetchCustomers() {
      try {
        currentData.customers = await apiGet('customers');
        renderCustomers();
      } catch (e) { console.error(e); }
    }

    async function fetchTransactions() {
      try {
        currentData.transactions = await apiGet('transactions');
        renderTransactions();
      } catch (e) { console.error(e); }
    }

    async function saveSettings() {
      const btn = document.getElementById('saveBtn');
      btn.innerText = 'Сохранение...';
      const payload = {
        base_cashback_percent: document.getElementById('base_cashback_percent').value,
        vip_cashback_percent: document.getElementById('vip_cashback_percent').value,
        vip_threshold: document.getElementById('vip_threshold').value,
        max_discount_percent: document.getElementById('max_discount_percent').value
      };

      await fetch('/admin/api/settings', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      
      btn.innerText = 'Сохранить настройки';
      const msg = document.getElementById('saveMsg');
      msg.classList.remove('hidden');
      setTimeout(() => msg.classList.add('hidden'), 3000);
    }

    async function manualBonus(customerId) {
      const amount = prompt("Введите сумму бонусов (с минусом для списания):");
      if(!amount || isNaN(amount)) return;
      
      const reason = prompt("Причина (необязательно):") || "Ручное начисление";
      
      const res = await fetch('/admin/api/customers/bonus', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' },
        body: JSON.stringify({ customerId, amount: Number(amount), reason })
      });

      if(res.ok) {
        alert("Успешно!");
        fetchCustomers();
        fetchTransactions();
      } else {
        alert("Ошибка!");
      }
    }

    // --- Renderers ---
    function renderCustomers() {
      const q = document.getElementById('searchCustomer').value.toLowerCase();
      const filtered = currentData.customers.filter(c => c.name?.toLowerCase().includes(q) || c.phone?.includes(q));
      
      const html = filtered.map(c => `
        <tr class="border-b border-slate-700 hover:bg-slate-800 transition">
          <td class="py-3 px-4">${c.name || 'Без имени'}</td>
          <td class="py-3 px-4">${c.phone}</td>
          <td class="py-3 px-4 text-right font-bold text-sky-400">${c.balance}</td>
          <td class="py-3 px-4 text-right text-emerald-400">${(c.total_spent || 0).toLocaleString()}</td>
          <td class="py-3 px-4 text-center">
            <button onclick="manualBonus('${c.id}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded text-white transition">+/- Бонусы</button>
          </td>
        </tr>
      `).join('');
      document.getElementById('customersTable').innerHTML = html;
    }

    function renderTransactions() {
      const html = currentData.transactions.map(t => {
        const d = new Date(t.timestamp).toLocaleString();
        const color = t.type.includes('deposit') ? 'text-emerald-400' : 'text-red-400';
        const sign = t.type.includes('deposit') ? '+' : '-';
        const name = t.customers ? t.customers.name : 'Unknown';
        const phone = t.customers ? t.customers.phone : '';
        return `
          <tr class="border-b border-slate-700 hover:bg-slate-800 transition">
            <td class="py-3 px-4 text-slate-400">${d}</td>
            <td class="py-3 px-4">${name} <span class="text-xs text-slate-500">${phone}</span></td>
            <td class="py-3 px-4 text-xs uppercase">${t.type}</td>
            <td class="py-3 px-4 text-right font-bold ${color}">${sign}${t.amount}</td>
          </tr>
        `;
      }).join('');
      document.getElementById('transactionsTable').innerHTML = html;
    }

    function renderChart() {
      const ctx = document.getElementById('myChart');
      if(chartInstance) chartInstance.destroy();
      chartInstance = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: ['Выдано бонусов', 'Потрачено бонусов'],
          datasets: [{
            data: [currentData.stats.totalEarned, currentData.stats.totalBurned],
            backgroundColor: ['#38bdf8', '#ef4444'],
            borderWidth: 0,
            hoverOffset: 10
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'right', labels: { color: '#f8fafc' } } }
        }
      });
    }
  </script>
</body>
</html>
